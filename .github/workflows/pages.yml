name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys racing each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (flatten web/ + copy spec/ next to app.js)
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/spec
          cp spec/field_map.json _site/spec/
          # Drop test files + Node-only package.json from the deploy artifact
          rm -rf _site/tests _site/package.json
          ls -laR _site | head -60
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
